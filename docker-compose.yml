# Postgres + pgvector, used from Day 2 to store chunk embeddings.
#   docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: askmycode
      POSTGRES_PASSWORD: askmycode
      POSTGRES_DB: askmycode
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
